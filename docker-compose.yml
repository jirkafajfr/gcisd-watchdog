services:
  mark-completed:
    build: .
    container_name: gcisd-watchdog-mark-completed
    volumes:
      - ./transcripts:/app/transcripts:ro
      - ./.yt-dlp-completed:/app/.yt-dlp-completed
    command: /app/scripts/mark-completed.sh

  download:
    image: jauderho/yt-dlp:latest
    container_name: gcisd-watchdog-download
    volumes:
      - ./videos:/app/videos
      - ./.yt-dlp-excluded:/app/.yt-dlp-excluded:ro
      - ./.yt-dlp-completed:/app/.yt-dlp-completed:ro
    working_dir: /app/videos
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat /app/.yt-dlp-excluded /app/.yt-dlp-completed 2>/dev/null > /tmp/combined-archive || true
        yt-dlp -f 'bestaudio[ext=webm]' --download-archive /tmp/combined-archive https://www.youtube.com/@GCISDTV/streams

  transcribe:
    build: .
    container_name: gcisd-watchdog-transcribe
    volumes:
      # Mount videos folder (input - webm files)
      - ./videos:/app/videos
      # Mount transcripts folder (output - txt files)
      - ./transcripts:/app/transcripts
      # Mount completed list (updated after transcription)
      - ./.yt-dlp-completed:/app/.yt-dlp-completed
    working_dir: /app/videos
    command: /app/scripts/transcribe.sh

  assemble:
    build: .
    container_name: gcisd-watchdog-generate-gpt-dataset
    volumes:
      - ./transcripts:/app/transcripts
      - ./gpt:/app/gpt
    command: /app/scripts/assemble.sh
